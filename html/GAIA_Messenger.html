<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GAIA Messenger Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f2f2f7; display: flex; height: 100vh; overflow: hidden; color: #1c1c1e; }

    /* App Shell Layout */
    #app-container { display: flex; width: 100vw; height: 100vh; position: relative; overflow: hidden; }

    /* Sidebar / Conversation Drawer */
    #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 20; backdrop-filter: blur(2px); }
    #sidebar {
      width: 320px;
      max-width: 85vw;
      background: #ffffff;
      border-right: 1px solid #e5e5ea;
      display: flex;
      flex-direction: column;
      z-index: 30;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid #e5e5ea;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fcfcfd;
    }
    .sidebar-header h2 { font-size: 16px; font-weight: 700; color: #1c1c1e; }
    .btn-new-chat-sidebar {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-new-chat-sidebar:hover { background: #0062cc; }

    #history-container { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .history-group-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8e8e93;
      margin: 14px 8px 6px 8px;
    }
    .history-item {
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 4px;
      position: relative;
      transition: background 0.15s ease;
    }
    .history-item:hover { background: #f2f2f7; }
    .history-item.active { background: #e5f1ff; }
    .history-item-top { display: flex; justify-content: space-between; align-items: center; }
    .history-item-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #1c1c1e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .history-item.active .history-item-title { color: #007aff; }
    .history-item-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8e8e93; }
    .badge-agent {
      background: #e5e5ea;
      color: #3a3a3c;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 10px;
    }
    .badge-pinned {
      background: #e1f5fe;
      color: #0288d1;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 9px;
      text-transform: uppercase;
    }
    .history-item.active .badge-agent { background: #cce4ff; color: #0062cc; }
    .btn-del-session {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: #8e8e93;
      font-size: 12px;
      padding: 2px 4px;
    }
    .history-item:hover .btn-del-session { display: block; }
    .btn-del-session:hover { color: #ff3b30; }

    /* Main Chat Layout */
    #main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #f2f2f7; }

    header {
      background: #ffffff;
      padding: 10px 16px;
      border-bottom: 1px solid #e5e5ea;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 18px; color: #1c1c1e; display: flex; align-items: center; }
    .header-title-box { display: flex; flex-direction: column; }
    .header-title-box h1 { font-size: 15px; font-weight: 700; color: #000; line-height: 1.2; }
    .header-subtitle { font-size: 11px; color: #8e8e93; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .active-agent-pill { color: #007aff; font-weight: 600; }

    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
    
    .message-row { display: flex; flex-direction: column; max-width: 80%; }
    .message-row.user { align-self: flex-end; align-items: flex-end; }
    .message-row.agent { align-self: flex-start; align-items: flex-start; }
    
    .bubble { padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
    .message-row.user .bubble { background: #007aff; color: #fff; border-bottom-right-radius: 4px; }
    .message-row.agent .bubble { background: #e5e5ea; color: #000; border-bottom-left-radius: 4px; }
    
    .meta-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8e8e93; margin-top: 4px; padding: 0 4px; }
    .agent-tag { font-weight: 600; color: #007aff; }
    .delivery-icon { font-size: 10px; }
    .delivered { color: #007aff; }
    .pending { color: #8e8e93; }

    /* Staged Attachment Preview Bar */
    #staged-bar { display: none; background: #fff; padding: 8px 16px; border-top: 1px solid #e5e5ea; align-items: center; gap: 12px; }
    #staged-preview { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }

    /* Input Dock */
    .input-area { background: #fff; padding: 10px 16px; border-top: 1px solid #e5e5ea; display: flex; gap: 8px; align-items: center; }
    .input-area select {
      padding: 8px 10px;
      border: 1px solid #c7c7cc;
      border-radius: 12px;
      outline: none;
      font-size: 13px;
      font-weight: 600;
      background: #f2f2f7;
      color: #007aff;
      cursor: pointer;
    }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #c7c7cc; border-radius: 20px; outline: none; font-size: 15px; }
    .input-area button { background: #007aff; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .clip-btn { background: none !important; color: #8e8e93 !important; font-size: 20px !important; width: auto !important; height: auto !important; padding: 0 4px; }

    .chat-img { max-width: 100%; max-height: 240px; border-radius: 12px; display: block; margin-bottom: 6px; cursor: pointer; }

    /* Modal Styling */
    #settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #fff; border-radius: 12px; width: 90%; max-width: 440px; padding: 20px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { font-size: 18px; margin-bottom: 4px; }
    .modal-content label { font-size: 11px; color: #8e8e93; font-weight: 600; text-transform: uppercase; margin-top: 4px; }
    .modal-content input, .modal-content select { padding: 8px 12px; border: 1px solid #c7c7cc; border-radius: 8px; font-size: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .btn-secondary { background: #e5e5ea; color: #000; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: #007aff; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }

    @media (max-width: 768px) {
      #sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #sidebar-overlay.open { display: block; }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="sidebar-overlay" onclick="toggleSidebar(false)"></div>

    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Threads & Slots</h2>
        <button class="btn-new-chat-sidebar" onclick="promptCreateTopic()">➕ New Topic</button>
      </div>
      <div id="history-container"></div>
    </aside>

    <main id="main-chat">
      <header>
        <div class="header-left">
          <button class="btn-icon" onclick="toggleSidebar()" title="Toggle History">☰</button>
          <div class="header-title-box">
            <h1 id="active-session-title">GAIA Messenger</h1>
            <div class="header-subtitle">
              <span>Agent:</span>
              <span id="active-session-agent-pill" class="active-agent-pill">@kevins-pa</span>
            </div>
          </div>
        </div>
        <button onclick="toggleSettings(true)" class="btn-icon" title="Settings">⚙️</button>
      </header>

      <div id="chat-container"></div>

      <div id="staged-bar">
        <img id="staged-preview" src="" alt="Attachment Preview">
        <span style="font-size: 12px; color: #8e8e93;">Photo attached</span>
        <button style="margin-left: auto; background: none; border: none; cursor: pointer; font-size: 16px;" onclick="clearStagedImage()">❌</button>
      </div>

      <div class="input-area">
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
        <button class="clip-btn" onclick="document.getElementById('file-input').click()">📎</button>
        
        <select id="agent-select" title="Target Agent" onchange="handleAgentChange(this.value)"></select>
        
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage(event)">↑</button>
      </div>
    </main>
  </div>

  <div id="settings-modal">
    <div class="modal-content">
      <h2>Bridge & Routing Settings</h2>
      
      <label>Server URL</label>
      <input type="text" id="cfg-server" placeholder="https://ntfy.sh">

      <label>NTFY Topic Name</label>
      <input type="text" id="cfg-topic" placeholder="my-shared-company-channel">

      <label>Target Bridge Server ID</label>
      <input type="text" id="cfg-target-id" placeholder="gaia-desktop">

      <label>This Client ID</label>
      <input type="text" id="cfg-sender-id" placeholder="kevin-web">

      <label>HMAC Secret (Signatures)</label>
      <input type="password" id="cfg-hmac-secret" placeholder="Shared HMAC Secret">

      <label>E2EE Passphrase</label>
      <input type="password" id="cfg-passphrase" placeholder="Shared E2EE Passphrase">

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
        <label style="margin: 0;">Known Agents</label>
        <button type="button" class="btn-secondary" style="padding: 3px 8px; font-size: 11px;" onclick="requestAgentList()">🔄 Refresh List</button>
      </div>
      <input type="text" id="cfg-agents" placeholder="kevins-pa">

      <label>Authorization Token (Optional)</label>
      <input type="password" id="cfg-authorization" placeholder="Leave blank for no auth">

      <label>History Retention</label>
      <select id="cfg-retention">
        <option value="1">1 Day</option>
        <option value="3">3 Days</option>
        <option value="7" selected>7 Days</option>
        <option value="14">14 Days</option>
        <option value="30">30 Days</option>
      </select>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="toggleSettings(false)">Cancel</button>
        <button class="btn-primary" onclick="saveSettings()">Save & Restart</button>
      </div>
    </div>
  </div>

  <script>
    const config = {
      serverUrl: localStorage.getItem('ntfy_server') || "https://ntfy.sh",
      topic: localStorage.getItem('ntfy_topic') || "my-shared-company-channel",
      targetId: localStorage.getItem('ntfy_target_id') || "gaia-desktop",
      senderId: localStorage.getItem('ntfy_sender_id') || "kevin-web",
      hmacSecret: localStorage.getItem('ntfy_hmac_secret') || "",
      passphrase: localStorage.getItem('ntfy_passphrase') || "",
      authorization: localStorage.getItem('ntfy_authorization') || "",
      retentionDays: parseInt(localStorage.getItem('ntfy_retention_days') || "7"),
      agents: JSON.parse(localStorage.getItem('gaia_known_agents') || '["kevins-pa"]')
    };

    let messages = [];
    let sessions = []; // Array of { id (thread_id), title, agentId, isPinned, createdAt, updatedAt }
    let activeThreadId = localStorage.getItem('gaia_active_thread') || "main";
    let eventSource = null;
    let stagedFileBytes = null;
    let stagedDataUrl = null;
    const STATIC_SALT = new TextEncoder().encode("kevins-pa-salt-v1");

    /* --- Smart Audio Alert Engine --- */
    function playNotificationSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function triggerAlert(title, body) {
      playNotificationSound();
      if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
        try {
          new Notification(title, { body: body.slice(0, 120), icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" });
        } catch (e) {}
      }
    }

    /* --- Auto-Scroll Engine --- */
    function isUserNearBottom(threshold = 140) {
      const container = document.getElementById("chat-container");
      if (!container) return true;
      const distanceToBottom = container.scrollHeight - container.clientHeight - container.scrollTop;
      return distanceToBottom <= threshold;
    }

    function scrollToBottom(force = false) {
      const container = document.getElementById("chat-container");
      if (!container) return;
      if (force || isUserNearBottom()) {
        requestAnimationFrame(() => {
          container.scrollTo({
            top: container.scrollHeight,
            behavior: force ? "instant" : "smooth"
          });
        });
      }
    }

    function arrayBufferToDataUrl(buffer, mimeType = "image/jpeg") {
      let binary = "";
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return `data:${mimeType};base64,${btoa(binary)}`;
    }

    window.onload = () => {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
      loadMessagesFromStorage();
      loadSessionsFromStorage();
      populateAgentDropdown();
      loadConfigToModal();
      ensureActiveSession();
      renderSidebar();
      updateHeaderMetadata();
      renderMessages();
      restartStream();
    };

    /* --- Deterministic Thread Slots Lifecycle --- */
    function loadSessionsFromStorage() {
      const stored = localStorage.getItem('gaia_threads_v3');
      if (stored) {
        try {
          sessions = JSON.parse(stored);
        } catch (e) {
          sessions = [];
        }
      }

      // Ensure Core Permanent Channels always exist
      const defaultAgent = config.agents[0] || "kevins-pa";
      
      let mainSlot = sessions.find(s => s.id === "main");
      if (!mainSlot) {
        mainSlot = {
          id: "main",
          title: "💬 Main Chat",
          agentId: defaultAgent,
          isPinned: true,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        sessions.unshift(mainSlot);
      }

      let alertsSlot = sessions.find(s => s.id === "alerts");
      if (!alertsSlot) {
        alertsSlot = {
          id: "alerts",
          title: "🔔 System Alerts",
          agentId: "system",
          isPinned: true,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        sessions.splice(1, 0, alertsSlot);
      }

      saveSessionsToStorage();
    }

    function saveSessionsToStorage() {
      localStorage.setItem('gaia_threads_v3', JSON.stringify(sessions));
      localStorage.setItem('gaia_active_thread', activeThreadId);
    }

    function getActiveSession() {
      return sessions.find(s => s.id === activeThreadId) || sessions[0];
    }

    function ensureActiveSession() {
      const existing = sessions.find(s => s.id === activeThreadId);
      if (!existing) {
        activeThreadId = "main";
        localStorage.setItem('gaia_active_thread', activeThreadId);
      }
      syncDropdownWithActiveSession();
    }

    function promptCreateTopic() {
      const name = prompt("Enter a name for the new topic/task thread:");
      if (!name || !name.trim()) return;

      const slug = name.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, "-");
      const currentAgent = getCurrentAgent();

      let target = sessions.find(s => s.id === slug);
      if (!target) {
        target = {
          id: slug,
          title: `# ${name.trim()}`,
          agentId: currentAgent,
          isPinned: false,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        sessions.push(target);
        saveSessionsToStorage();
      }

      switchSession(target.id);
    }

    function switchSession(threadId) {
      activeThreadId = threadId;
      localStorage.setItem('gaia_active_thread', activeThreadId);
      syncDropdownWithActiveSession();
      updateHeaderMetadata();
      renderSidebar();
      renderMessages();
      scrollToBottom(true);
      toggleSidebar(false);
    }

    function deleteSession(e, threadId) {
      if (e) e.stopPropagation();

      const session = sessions.find(s => s.id === threadId);
      if (session && session.isPinned) {
        if (!confirm(`Clear message history for ${session.title}?`)) return;
        messages = messages.filter(m => m.sessionId !== threadId);
        saveMessagesToStorage();
        renderMessages();
        return;
      }

      if (!confirm("Delete this thread and its history?")) return;

      messages = messages.filter(m => m.sessionId !== threadId);
      sessions = sessions.filter(s => s.id !== threadId);

      saveMessagesToStorage();

      if (activeThreadId === threadId) {
        activeThreadId = "main";
      }
      saveSessionsToStorage();
      renderSidebar();
      updateHeaderMetadata();
      renderMessages();
    }

    function handleAgentChange(newAgent) {
      const active = getActiveSession();
      if (active && !active.isPinned) {
        active.agentId = newAgent.toLowerCase();
        saveSessionsToStorage();
        updateHeaderMetadata();
      }
    }

    function syncDropdownWithActiveSession() {
      const active = getActiveSession();
      if (!active) return;
      const select = document.getElementById("agent-select");
      if (select && active.agentId && active.agentId !== "system") {
        registerDiscoveredAgent(active.agentId);
        select.value = active.agentId.toLowerCase();
      }
    }

    function updateHeaderMetadata() {
      const active = getActiveSession();
      if (!active) return;
      document.getElementById("active-session-title").textContent = active.title;
      document.getElementById("active-session-agent-pill").textContent = `@${active.agentId}`;
    }

    function renderSidebar() {
      const container = document.getElementById("history-container");
      container.innerHTML = "";

      const pinned = sessions.filter(s => s.isPinned);
      const topics = sessions.filter(s => !s.isPinned)
        .sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));

      // 1. Core Channels
      if (pinned.length > 0) {
        const header = document.createElement("div");
        header.className = "history-group-header";
        header.textContent = "Core Channels";
        container.appendChild(header);

        pinned.forEach(session => {
          const item = document.createElement("div");
          item.className = `history-item ${session.id === activeThreadId ? "active" : ""}`;
          item.onclick = () => switchSession(session.id);

          item.innerHTML = `
            <div class="history-item-top">
              <span class="history-item-title">${escapeHTML(session.title)}</span>
              <button class="btn-del-session" onclick="deleteSession(event, '${session.id}')" title="Clear history">🧹</button>
            </div>
            <div class="history-item-meta">
              <span class="badge-pinned">Permanent</span>
              <span>@${escapeHTML(session.agentId)}</span>
            </div>
          `;
          container.appendChild(item);
        });
      }

      // 2. Dedicated Topics & Tasks
      if (topics.length > 0) {
        const header = document.createElement("div");
        header.className = "history-group-header";
        header.textContent = "Topics & Tasks";
        container.appendChild(header);

        topics.forEach(session => {
          const item = document.createElement("div");
          item.className = `history-item ${session.id === activeThreadId ? "active" : ""}`;
          item.onclick = () => switchSession(session.id);

          const timeStr = new Date(session.updatedAt || session.createdAt).toLocaleDateString([], { month: 'short', day: 'numeric' });

          item.innerHTML = `
            <div class="history-item-top">
              <span class="history-item-title">${escapeHTML(session.title)}</span>
              <button class="btn-del-session" onclick="deleteSession(event, '${session.id}')" title="Delete thread">🗑️</button>
            </div>
            <div class="history-item-meta">
              <span class="badge-agent">@${escapeHTML(session.agentId)}</span>
              <span>${timeStr}</span>
            </div>
          `;
          container.appendChild(item);
        });
      }
    }

    function toggleSidebar(forceState) {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      const shouldOpen = forceState !== undefined ? forceState : !sidebar.classList.contains("open");
      if (shouldOpen) {
        sidebar.classList.add("open");
        overlay.classList.add("open");
      } else {
        sidebar.classList.remove("open");
        overlay.classList.remove("open");
      }
    }

    function escapeHTML(str) {
      return (str || "").replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    function getCurrentAgent() {
      return (document.getElementById("agent-select").value || config.agents[0] || "kevins-pa").toLowerCase();
    }

    function populateAgentDropdown() {
      const select = document.getElementById("agent-select");
      select.innerHTML = "";
      config.agents.forEach(agentId => {
        const opt = document.createElement("option");
        opt.value = agentId;
        opt.textContent = `@${agentId}`;
        select.appendChild(opt);
      });
      syncDropdownWithActiveSession();
    }

    function registerDiscoveredAgent(agentId) {
      if (!agentId || agentId.toLowerCase() === "system") return;
      const cleanId = agentId.toLowerCase().trim();
      if (!config.agents.includes(cleanId)) {
        config.agents.push(cleanId);
        localStorage.setItem('gaia_known_agents', JSON.stringify(config.agents));
        populateAgentDropdown();

        const cfgInput = document.getElementById("cfg-agents");

    function loadMessagesFromStorage() {
      try {
        const stored = localStorage.getItem('gaia_chat_history');
        if (stored) {
          const parsed = JSON.parse(stored);
          const cutoff = Date.now() - (config.retentionDays * 86400 * 1000);
          messages = parsed
            .map(m => ({ ...m, time: new Date(m.time) }))
            .filter(m => m.time.getTime() >= cutoff);
          messages.sort((a, b) => a.time - b.time);

    function saveMessagesToStorage() {
      try {
        const cutoff = Date.now() - (config.retentionDays * 86400 * 1000);
        const pruned = messages.filter(m => m.time.getTime() >= cutoff);

      } catch (e) {}
    }

    /* --- Cryptography Engine --- */
    async function deriveKey(passphrase, saltBuffer) {
      if (!passphrase || !window.crypto || !window.crypto.subtle) return null;
      try {
        const keyMaterial = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(passphrase.trim()), "PBKDF2", false, ["deriveKey"]
        );
        return await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: saltBuffer, iterations: 100000, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      } catch (e) {
        return null;
      }
    }

    async function encryptBytes(arrayBuffer) {
      if (!config.passphrase) return arrayBuffer;

      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(config.passphrase, salt);
      if (!key) throw new Error("Key derivation failed.");

      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, arrayBuffer);

      const combined = new Uint8Array(salt.length + iv.length + ciphertext.byteLength);
      combined.set(salt, 0);
      combined.set(iv, 16);
      combined.set(new Uint8Array(ciphertext), 28);
      return combined.buffer;
    }

    async function decryptBytes(arrayBuffer) {
      if (!config.passphrase) return arrayBuffer;
      const data = new Uint8Array(arrayBuffer);

      if (data.length >= 28) {
        try {
          const dynamicSalt = data.slice(0, 16);
          const iv = data.slice(16, 28);
          const ciphertext = data.slice(28);
          const dynamicKey = await deriveKey(config.passphrase, dynamicSalt);
          if (dynamicKey) {
            return await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, dynamicKey, ciphertext);
          }
        } catch (e) {}
      }

      if (data.length >= 12) {
        try {
          const iv = data.slice(0, 12);
          const ciphertext = data.slice(12);
          const staticKey = await deriveKey(config.passphrase, STATIC_SALT);
          if (staticKey) {
            return await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, staticKey, ciphertext);
          }
        } catch (e) {}
      }

      throw new Error("Failed to decrypt payload.");
    }

    async function encryptText(plaintext) {
      if (!config.passphrase) return plaintext;
      const encoded = new TextEncoder().encode(plaintext);
      const encrypted = await encryptBytes(encoded);
      let binaryStr = "";
      const bytes = new Uint8Array(encrypted);
      for (let i = 0; i < bytes.length; i++) binaryStr += String.fromCharCode(bytes[i]);
      return btoa(binaryStr);
    }

    async function decryptText(base64Payload) {
      if (!config.passphrase || !base64Payload) return base64Payload;
      try {
        const cleanStr = base64Payload.trim().replace(/^"|"$/g, '');
        const binaryStr = atob(cleanStr);
        const data = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) data[i] = binaryStr.charCodeAt(i);

        const decryptedBuffer = await decryptBytes(data.buffer);
        return new TextDecoder().decode(decryptedBuffer);
      } catch (e) {
        return base64Payload;
      }
    }

    /* Envelope with Canonical HMAC Matching */
    async function createSignedEnvelope(promptText, threadId, agentId) {
      const encoder = new TextEncoder();
      const nonce = Array.from(crypto.getRandomValues(new Uint8Array(8)))
        .map(b => b.toString(16).padStart(2, '0')).join('');
      const ts = Math.floor(Date.now() / 1000);

      // Keep payload flat so JS sorting matches Python's sort_keys=True byte-for-byte
      const payload = {
        agent_id: agentId,
        agent_type: agentId,
        session_id: threadId,
        text: promptText,
        thread_id: threadId
      };

      const sortedKeys = Object.keys(payload).sort();
      const payloadJson = "{" + sortedKeys.map(k => `${JSON.stringify(k)}:${JSON.stringify(payload[k])}`).join(",") + "}";
      const sigBase = `${nonce}|${ts}|${payloadJson}`;

      let signature = "";
      if (config.hmacSecret) {
        const hmacKey = await crypto.subtle.importKey(
          "raw", encoder.encode(config.hmacSecret.trim()),
          { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
        );
        const sigBuffer = await crypto.subtle.sign("HMAC", hmacKey, encoder.encode(sigBase));
        signature = Array.from(new Uint8Array(sigBuffer))
          .map(b => b.toString(16).padStart(2, '0')).join('');
      }

      const envelope = {
        target: config.targetId,
        sender: config.senderId,
        nonce: nonce,
        ts: ts,
        payload: payload,
        sig: signature
      };

      return JSON.stringify(envelope);
    }

    function extractTextFromDecryptedPayload(rawString) {
      if (!rawString || typeof rawString !== "string") return rawString;
      const trimmed = rawString.trim();

      if (trimmed.startsWith("[AGENTS_LIST]") || trimmed.startsWith("[SYSTEM")) return rawString;
      if (!trimmed.startsWith("{") && !trimmed.startsWith("[{") && !trimmed.startsWith('["')) return rawString;

      try {
        let parsed = JSON.parse(trimmed);
        if (parsed && parsed.payload && typeof parsed.payload.text === "string") return parsed.payload.text.trim();
        if (parsed && typeof parsed.result === "string") return parsed.result.trim();
        if (parsed && typeof parsed.response === "string") return parsed.response.trim();
        if (parsed && typeof parsed.output === "string") return parsed.output.trim();

        if (parsed && Array.isArray(parsed.content)) {
          const texts = parsed.content
            .map(item => (typeof item === "object" && item !== null ? item.text : ""))
            .filter(Boolean);
          if (texts.length > 0) return texts.join("\n\n").trim();
        }
        
        if (parsed && typeof parsed.content === "string") return parsed.content.trim();
      } catch (e) {}
      
      return rawString;
    }

    function getAuthQueryParam() {
      const token = config.authorization.trim();
      if (!token) return "";
      let authHeader = token;
      if (!authHeader.toLowerCase().startsWith("bearer ") && !authHeader.toLowerCase().startsWith("basic ")) {
        authHeader = "Bearer " + token;
      }
      return `&auth=${encodeURIComponent(btoa(authHeader))}`;
    }

    function restartStream() {
      if (eventSource) eventSource.close();

      const cleanedServer = config.serverUrl.replace(/\/+$/, "");
      let sinceParam = `${config.retentionDays * 24}h`;
      if (messages.length > 0) {
        const newestTimestamp = Math.max(...messages.map(m => m.time.getTime()));
        sinceParam = `${Math.floor(newestTimestamp / 1000)}`;
      }

      const streamUrl = `${cleanedServer}/${config.topic}/sse?since=${sinceParam}${getAuthQueryParam()}`;
      eventSource = new EventSource(streamUrl);
      eventSource.onmessage = (event) => handleSseEvent(event);
    }

    /* --- Strict Multi-Server / Multi-Client Inbound Event Handler --- */
    async function handleSseEvent(event) {
      try {
        const payload = JSON.parse(event.data);
        if (payload.event !== "message") return;

        let rawPayload = (payload.message || "").trim();
        let attachmentUrl = null;

        // 1. Text attachment resolution
        if (payload.attachment && payload.attachment.url) {
          const att = payload.attachment;
          const attName = (att.name || "").toLowerCase();
          const attType = (att.type || "").toLowerCase();

          const isTextAttachment = (
            attName.endsWith(".txt") ||
            attName === "attachment" ||
            attName === "attachment.txt" ||
            attType.startsWith("text/")
          );

          if (isTextAttachment) {
            try {
              let response = await fetch(att.url);
              if (!response.ok && config.authorization) {
                const authParam = getAuthQueryParam();
                const authenticatedUrl = att.url.includes("?") 
                  ? `${att.url}${authParam}` 
                  : `${att.url}?${authParam.replace(/^&/, "")}`;
                response = await fetch(authenticatedUrl);
              }

              if (response.ok) {
                const fetchedText = await response.text();
                if (fetchedText.trim()) rawPayload = fetchedText.trim();
              }
            } catch (fetchErr) {}
            attachmentUrl = null;
          } else {
            attachmentUrl = att.url;
          }
        }

        let displayText = rawPayload ? await decryptText(rawPayload) : "";

        // 2. Intercept silent ACK packets
        if (displayText.startsWith("{")) {
          try {
            const parsed = JSON.parse(displayText);
            if (parsed.ack && parsed.ack.ref_id) {
              const targetMsg = messages.find(m => m.id === parsed.ack.ref_id);
              if (targetMsg) {
                targetMsg.pipelineStatus = parsed.ack.status; // "received" or "processing"
                saveMessagesToStorage();
                renderMessages();
              }
              return;
            }
          } catch (e) {}
        }

        // 3. Extract Routing Tags & Body Envelopes
        let routing = {
          sender_type: "server",
          sender_id: "",
          target_server: "*",
          target_client: "*",
          agent_id: "",
          thread_id: ""
        };

        const tags = payload.tags || [];
        tags.forEach(t => {
          if (t.startsWith("tid:")) routing.thread_id = t.replace("tid:", "");
          else if (t.startsWith("sid:")) routing.thread_id = t.replace("sid:", "");
          else if (t.startsWith("agent:")) routing.agent_id = t.replace("agent:", "");
          else if (t.startsWith("client:")) routing.sender_id = t.replace("client:", "");
        });

        if (displayText.startsWith("{")) {
          try {
            const parsedEnv = JSON.parse(displayText);
            if (parsedEnv.payload && parsedEnv.payload.routing) {
              routing = { ...routing, ...parsedEnv.payload.routing };
            } else if (parsedEnv.routing) {
              routing = { ...routing, ...parsedEnv.routing };
            }
          } catch (e) {}
        }

        const title = payload.title || "";
        const hasClientTag = tags.some(t => t.startsWith("client:"));
        const hasRobotTag = tags.includes("robot");

        // 4. Robust Origin Classification:
        // A message is from the user ONLY if explicitly tagged with client: or marked sender_type: "client"
        const isUser = (routing.sender_type === "client") || hasClientTag;

        // 5. Echo Suppression & Multi-Device Filtering
        if (isUser) {
          if (routing.sender_id && routing.sender_id !== config.senderId) {
            return; // Sibling client prompt; ignore
          }
        } else {
          if (routing.target_client !== "*" && routing.target_client !== config.senderId) {
            return; // Targeted at a different device
          }
        }

        // 6. System Commands & Agent Lists
        if (displayText.startsWith("[AGENTS_LIST]:")) {
          try {
            const jsonPart = displayText.replace("[AGENTS_LIST]:", "").trim();
            const list = JSON.parse(jsonPart);
            if (Array.isArray(list)) list.forEach(agent => registerDiscoveredAgent(agent));
          } catch (err) {}
          return;
        }

        if (displayText.startsWith("[SYSTEM_COMMAND:")) return;

        displayText = extractTextFromDecryptedPayload(displayText);

        const msgTime = new Date(payload.time * 1000);

        // 7. Deterministic Thread Resolution:
        // Notifications without a specified thread default to 'alerts'
        let msgThreadId = routing.thread_id;
        if (!msgThreadId) {
          msgThreadId = isUser ? "main" : "alerts";
        }

        let msgAgentId = routing.agent_id ? routing.agent_id.toLowerCase() : null;
        if (!msgAgentId && title) {
          const match = title.match(/@([a-zA-Z0-9_-]+)/) || title.match(/\(([a-zA-Z0-9_-]+)\)/);
          if (match) msgAgentId = match[1].toLowerCase();
        }

        // 8. Track or create target thread session
        let targetSession = sessions.find(s => s.id === msgThreadId);
        if (!targetSession) {
          const autoTitle = (msgThreadId === "alerts") ? "🔔 System Alerts" : `# ${msgThreadId}`;
          targetSession = {
            id: msgThreadId,
            title: autoTitle,
            agentId: msgAgentId || (isUser ? getCurrentAgent() : "system"),
            isPinned: (msgThreadId === "main" || msgThreadId === "alerts"),
            createdAt: msgTime.getTime(),
            updatedAt: msgTime.getTime()
          };
          sessions.push(targetSession);
          saveSessionsToStorage();
          renderSidebar();
        } else {
          targetSession.updatedAt = msgTime.getTime();
          if (msgAgentId && msgAgentId !== "system" && !targetSession.isPinned) {
            targetSession.agentId = msgAgentId;
          }
          saveSessionsToStorage();
          renderSidebar();
        }

        if (msgAgentId) registerDiscoveredAgent(msgAgentId);

        // 9. Message Deduplication & Rendering
        const localIndex = messages.findIndex(m => 
          m.isFromUser && 
          (m.id === payload.id || (m.id.startsWith("temp-") && m.text.trim() === displayText.trim()))
        );

        if (localIndex !== -1) {
          messages[localIndex].id = payload.id;
          messages[localIndex].isDelivered = true;
          messages[localIndex].time = msgTime;
          messages[localIndex].sessionId = msgThreadId;
          if (displayText) messages[localIndex].text = displayText;
          if (attachmentUrl) messages[localIndex].attachmentUrl = attachmentUrl;
          saveMessagesToStorage();
          renderMessages();
        } else if (!messages.some(m => m.id === payload.id)) {
          const msgObj = {
            id: payload.id,
            text: displayText,
            attachmentUrl: attachmentUrl,
            isFromUser: isUser,
            agentId: msgAgentId || targetSession.agentId || (isUser ? getCurrentAgent() : "system"),
            sessionId: msgThreadId,
            isDelivered: true,
            time: msgTime,
            actions: payload.actions || null
          };

          messages.push(msgObj);
          messages.sort((a, b) => a.time - b.time);

          // Mark preceding user prompt in this slot completed & trigger alert
          if (!isUser) {
            for (let i = messages.length - 1; i >= 0; i--) {
              if (messages[i].isFromUser && messages[i].sessionId === msgThreadId) {
                messages[i].pipelineStatus = "completed";
                break;
              }
            }
            triggerAlert(title || `GAIA (@${msgObj.agentId})`, displayText || "Notification alert");
          }

          saveMessagesToStorage();
          renderMessages();
        }
      } catch (e) {
        console.error("Stream parse error:", e);
      }
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        stagedFileBytes = evt.target.result;
        stagedDataUrl = arrayBufferToDataUrl(stagedFileBytes, file.type || "image/jpeg");
        document.getElementById("staged-preview").src = stagedDataUrl;
        document.getElementById("staged-bar").style.display = "flex";
      };
      reader.readAsArrayBuffer(file);
    }

    async function requestAgentList() {
      try {
        const commandEnvelope = await createSignedEnvelope("!agents", activeThreadId, getCurrentAgent());
        let payloadText = commandEnvelope;

        if (config.passphrase) {
          payloadText = await encryptText(commandEnvelope);
        }

        const headers = getAuthHeaders();
        headers["Title"] = "User Command";
        headers["Priority"] = "4";
        headers["Tags"] = `tid:${activeThreadId},agent:${getCurrentAgent()},client:${config.senderId}`;

        const cleanedServer = config.serverUrl.replace(/\/+$/, "");
        await fetch(`${cleanedServer}/${config.topic}`, {
          method: "POST",
          body: payloadText,
          headers: headers
        });
      } catch (err) {}
    }

    function clearStagedImage() {
      stagedFileBytes = null;
      stagedDataUrl = null;
      document.getElementById("file-input").value = "";
      document.getElementById("staged-bar").style.display = "none";
    }

    async function sendMessage(e) {
      if (e && e.preventDefault) e.preventDefault();

      const inputEl = document.getElementById("message-input");
      const selectedAgent = getCurrentAgent();
      const text = inputEl.value.trim();
      if (!text && !stagedFileBytes) return;

      let formattedPrompt = text;
      if (text && !text.startsWith("@")) {
        formattedPrompt = `@${selectedAgent} ${text}`;
      }

      const tempId = "temp-" + Date.now();
      let localImgUrl = stagedDataUrl;

      const active = getActiveSession();
      if (active) {
        active.updatedAt = Date.now();
        if (!active.isPinned) active.agentId = selectedAgent;
        saveSessionsToStorage();
        renderSidebar();
      }

      let signedEnvelope = await createSignedEnvelope(formattedPrompt, activeThreadId, selectedAgent);
      let payloadText = signedEnvelope;

      if (config.passphrase && signedEnvelope) {
        try {
          payloadText = await encryptText(signedEnvelope);
        } catch (encErr) {
          alert("⚠️ Encryption Error: Web Crypto unavailable.");
          return;
        }
      }

      const localMsg = {
        id: tempId,
        text: text,
        localImgUrl: localImgUrl,
        isFromUser: true,
        agentId: selectedAgent,
        sessionId: activeThreadId,
        isDelivered: false,
        time: new Date()
      };

      messages.push(localMsg);
      saveMessagesToStorage();
      
      renderMessages();
      scrollToBottom(true);
      
      inputEl.value = "";
      const sendingBytes = stagedFileBytes;
      clearStagedImage();

      try {
        const headers = getAuthHeaders();
        headers["Priority"] = "4";
        headers["Tags"] = `tid:${activeThreadId},agent:${selectedAgent},client:${config.senderId}`;
        
        // Explicit Routing Envelope Headers
        headers["X-Sender-Type"] = "client";
        headers["X-Sender-ID"] = config.senderId;
        headers["X-Target-Server"] = config.targetId;
        headers["X-Target-Client"] = config.senderId;
        headers["X-Agent-ID"] = selectedAgent;
        headers["X-Thread-ID"] = activeThreadId;
        headers["X-Message-Type"] = "chat";

        const cleanedServer = config.serverUrl.replace(/\/+$/, "");

        if (sendingBytes) {
          headers["Filename"] = "enc_photo.bin";
          if (payloadText) headers["Message"] = payloadText.replace(/[\r\n]+/g, " ");

          let bodyPayload = config.passphrase ? await encryptBytes(sendingBytes) : sendingBytes;

          const response = await fetch(`${cleanedServer}/${config.topic}`, {
            method: "PUT",
            body: bodyPayload,
            headers: headers
          });

          if (response.ok) {
            const resData = await response.json();
            if (resData && resData.id) {
              const idx = messages.findIndex(m => m.id === tempId);
              if (idx !== -1) {
                messages[idx].id = resData.id;
                messages[idx].isDelivered = true;
                saveMessagesToStorage();
                renderMessages();
              }
            }
          }
        } else {
          headers["Title"] = `Prompt -> @${selectedAgent}`;
          const response = await fetch(`${cleanedServer}/${config.topic}`, {
            method: "POST",
            body: payloadText,
            headers: headers
          });

          if (response.ok) {
            const resData = await response.json();
            if (resData && resData.id) {
              const idx = messages.findIndex(m => m.id === tempId);
              if (idx !== -1) {
                messages[idx].id = resData.id;
                messages[idx].isDelivered = true;
                saveMessagesToStorage();
                renderMessages();
              }
            }
          }
        }
      } catch (err) {
        console.error("[NTFY SEND EXCEPTION]", err);
      }
    }

    function renderMessages() {
      const wasAtBottom = isUserNearBottom();
      const container = document.getElementById("chat-container");
      container.innerHTML = "";

      const filtered = messages.filter(m => m.sessionId === activeThreadId);

      filtered.forEach(m => {
        const row = document.createElement("div");
        row.className = `message-row ${m.isFromUser ? "user" : "agent"}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        if (m.localImgUrl) {
          const img = document.createElement("img");
          img.className = "chat-img";
          img.src = m.localImgUrl;
          img.onload = () => { if (isUserNearBottom(200)) scrollToBottom(true); };
          bubble.appendChild(img);
        } else if (m.attachmentUrl) {
          const imgContainer = document.createElement("div");
          imgContainer.style.marginBottom = "6px";
          imgContainer.textContent = "⌛ Loading attachment...";
          bubble.appendChild(imgContainer);

          fetchAndDecryptImage(m.attachmentUrl).then(src => {
            if (src) {
              const img = document.createElement("img");
              img.className = "chat-img";
              img.src = src;
              img.onload = () => { if (isUserNearBottom(200)) scrollToBottom(true); };
              imgContainer.innerHTML = "";
              imgContainer.appendChild(img);
              if (wasAtBottom) scrollToBottom(true);
            } else {
              imgContainer.textContent = "📎 Image attachment";
            }
          });
        }

        if (m.text) {
          const textNode = document.createTextNode(m.text);
          bubble.appendChild(textNode);
        }

        const metaRow = document.createElement("div");
        metaRow.className = "meta-row";

        if (!m.isFromUser && m.agentId) {
          const tag = document.createElement("span");
          tag.className = "agent-tag";
          tag.textContent = `@${m.agentId}`;
          metaRow.appendChild(tag);
        }

        const timeSpan = document.createElement("span");
        timeSpan.textContent = m.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        metaRow.appendChild(timeSpan);

        if (m.isFromUser) {
          const deliveryIcon = document.createElement("span");
          deliveryIcon.className = "delivery-icon";

          // Auto-resolve: if any agent response exists after this prompt, it's completed
          const hasBeenAnswered = messages.some(other => 
            !other.isFromUser && 
            other.sessionId === m.sessionId && 
            new Date(other.time) >= new Date(m.time)
          );

          const status = (hasBeenAnswered || m.pipelineStatus === "completed") 
            ? "completed" 
            : (m.pipelineStatus || (m.isDelivered ? "received" : "pending"));

          if (status === "processing") {
            deliveryIcon.textContent = "🧠";
            deliveryIcon.title = "Agent is thinking / executing tools...";
          } else if (status === "completed") {
            deliveryIcon.textContent = "✓✓";
            deliveryIcon.className += " delivered";
            deliveryIcon.title = "Response completed";
          } else if (status === "received") {
            deliveryIcon.textContent = "✓";
            deliveryIcon.className += " delivered";
            deliveryIcon.title = "Received by GAIA bridge";
          } else {
            deliveryIcon.textContent = "🕒";
            deliveryIcon.className += " pending";
            deliveryIcon.title = "Sending...";
          }

          metaRow.appendChild(deliveryIcon);
        }

        row.appendChild(bubble);
        row.appendChild(metaRow);
        container.appendChild(row);
      });

      if (wasAtBottom) {
        scrollToBottom(true);
      }
    }

    async function fetchAndDecryptImage(url) {
      try {
        const headers = getAuthHeaders();
        const resp = await fetch(url, { headers });
        if (!resp.ok) return null;

        const arrayBuffer = await resp.arrayBuffer();
        const decryptedBuffer = await decryptBytes(arrayBuffer);
        return arrayBufferToDataUrl(decryptedBuffer, "image/jpeg");
      } catch (e) {
        return null;
      }
    }

      document.getElementById("cfg-retention").value = config.retentionDays;
    }

    function saveSettings() {
      config.serverUrl = document.getElementById("cfg-server").value.trim() || "https://ntfy.sh";
      config.topic = document.getElementById("cfg-topic").value.trim();
      config.targetId = document.getElementById("cfg-target-id").value.trim() || "gaia-desktop";
      config.senderId = document.getElementById("cfg-sender-id").value.trim() || "kevin-web";
      config.hmacSecret = document.getElementById("cfg-hmac-secret").value.trim();
      config.passphrase = document.getElementById("cfg-passphrase").value.trim();
      config.authorization = document.getElementById("cfg-authorization").value.trim();
      config.retentionDays = parseInt(document.getElementById("cfg-retention").value);

      const rawAgents = document.getElementById("cfg-agents").value.split(",");
      config.agents = rawAgents.map(a => a.trim().toLowerCase()).filter(a => a.length > 0);
      if (config.agents.length === 0) config.agents = ["kevins-pa"];

      localStorage.setItem('ntfy_server', config.serverUrl);
      localStorage.setItem('ntfy_topic', config.topic);
      localStorage.setItem('ntfy_target_id', config.targetId);
      localStorage.setItem('ntfy_sender_id', config.senderId);
      localStorage.setItem('ntfy_hmac_secret', config.hmacSecret);
      localStorage.setItem('ntfy_passphrase', config.passphrase);
      localStorage.setItem('ntfy_authorization', config.authorization);
      localStorage.setItem('ntfy_retention_days', config.retentionDays);
      localStorage.setItem('gaia_known_agents', JSON.stringify(config.agents));

      populateAgentDropdown();
      ensureActiveSession();
      renderSidebar();
      toggleSettings(false);
      loadMessagesFromStorage();
      restartStream();
    }
  </script>
</body>
</html>
